<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나이스 그리드 낭독 비교</title>
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
<main>
  <h1>나이스 그리드 낭독 비교</h1>
  <ul>
    <li>Tab으로 표에 들어간 뒤 방향키로 칸 이동, 스페이스로 행선택</li>
    <li>V: 보던 칸 그대로 버전 전환</li>
    <li>R 또는 「읽기」 버튼: 칸 이름을 브라우저 음성으로 듣기</li>
  </ul>

  <div class="controls">
    <label>화면
      <select id="screen"></select>
    </label>
    <button type="button" id="toggle">개선안으로 전환</button>
    <p id="status" class="status" aria-live="polite"></p>
  </div>

  <h2 id="grid-heading"></h2>

  <div class="layout">
    <div class="grid-wrap" id="grid-host" tabindex="-1"></div>

    <div class="panel">
      <h2>낭독 패널</h2>
      <p id="p-name"></p>
      <p id="p-role"></p>
      <p id="p-pos"></p>
      <p id="p-entry"></p>
      <p>
        <button type="button" id="speak" accesskey="r">읽기</button>
        <label><input type="checkbox" id="auto-speak"> 칸을 옮길 때 자동으로 읽기</label>
      </p>
      <h3>이 행을 왼쪽부터 훑을 때 들리는 이름</h3>
      <ol id="p-row"></ol>
      <h3>이 칸의 마크업</h3>
      <pre id="p-markup"></pre>
    </div>
  </div>
</main>
<script type="module" src="app.js?v=7"></script>
</body>
</html>
